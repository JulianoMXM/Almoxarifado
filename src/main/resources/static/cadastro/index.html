<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Almoxarifado - Cadastro de Usuários</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="cadastro-usuarios.js"></script>
    </head>
    <body>
        <header class="topbar">
            <div class="brand">Almoxarifado</div>
            <nav class="page-nav">
                <a href="../componentes/index.html" class="nav-link">Componentes</a>
                <a href="../chaves/index.html" class="nav-link">Chaves</a>
                <a href="../cadastro/index.html" class="nav-link active">Cadastro</a>
            </nav>
        </header>

        <main class="container">
            <section class="hero">
                <h1>Controle de Acesso</h1>
                <p>Gerencie as contas do sistema permitindo o autocadastro de novos usuários comuns, alunos ou professores com suas respectivas credenciais.</p>
            </section>

            <section class="selector-panel">
                <div class="selector-title">
                    <h2>Tipo de perfil</h2>
                </div>
                <div class="object-tabs">
                    <button class="object-button active" data-profile="usuario">Usuário Comum</button>
                    <button class="object-button" data-profile="aluno">Aluno</button>
                    <button class="object-button" data-profile="professor">Professor</button>
                </div>
            </section>

            <section class="action-panel">
                <div class="action-content">
                    <article class="action-card active">
                        <h3 id="formTitle">Cadastrar Usuário Comum</h3>
                        
                        <form id="cadastroUsuarioForm" class="component-form">
                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>

                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="nome@instituicao.com" required>

                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>

                            <div class="profile-field" data-profile="aluno" style="display: none;">
                                <label for="ra">RA (Registro Acadêmico)</label>
                                <input type="text" id="ra" name="ra" placeholder="Digite o RA do aluno">
                            </div>

                            <div class="profile-field" data-profile="professor" style="display: none;">
                                <label for="siape">SIAPE</label>
                                <input type="text" id="siape" name="siape" placeholder="Digite o número SIAPE">
                            </div>

                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>

                            <button type="submit">Cadastrar</button>
                        </form>
                    </article>
                </div>
            </section>
        </main>
    </body>
</html>
